<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B-H材料转矩分析</title>
<style>*{box-sizing:border-box}body{margin:0;color:#203047;background:#f3f6fa;font:15px system-ui,"Microsoft YaHei",sans-serif}header{background:#162b43;padding:20px;color:white}header a{color:#dbeafe;margin-left:18px}main{max-width:1050px;margin:auto;padding:22px}.card{padding:22px;background:white;border:1px solid #dce5ef;border-radius:9px;margin-bottom:18px}h1{font-size:23px;display:inline}h2{font-size:19px;margin-top:0}.notice{background:#fff7df;padding:14px;line-height:1.7;border-radius:5px}.muted{color:#64748b;line-height:1.8}button,select{padding:10px;border:1px solid #cbd5e1;border-radius:5px;max-width:100%}button{background:#2466ad;color:white;cursor:pointer}button:disabled{background:#cbd5e1;cursor:default}a{color:#2466ad}dl{display:grid;grid-template-columns:130px 1fr;gap:12px}dd{margin:0;overflow-wrap:anywhere}dt{color:#64748b}.error{color:#a82c36;white-space:pre-wrap}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}svg{width:100%;height:300px}pre{white-space:pre-wrap;font-size:12px;overflow-wrap:anywhere}.metrics{display:flex;gap:22px;flex-wrap:wrap}.metrics div{min-width:120px}.metrics strong{font-size:24px;display:block} @media(max-width:650px){main{padding:12px}header h1{display:block}dl{grid-template-columns:1fr}header a{margin-left:0;margin-right:12px}}</style></head>
<body data-artifact="{{ artifact }}"><header><h1>B-H材料转矩分析</h1><a href="/material-library">材料库</a><a href="/motor-waveforms">官方波形</a><a href="/system">系统首页</a></header>
<main><section class="card"><h2>校准材料分析计划</h2><p id="planStatus" class="muted">正在读取保存计划…</p><p id="planError" class="error" role="alert"></p><dl id="identity"></dl><p class="notice">当前校准材料尚未进行电机求解。计划只准备转矩分析，不计算效率或参与最终优化排名。原生材料导入通过后可以复制已保存工程；本页不自动启动求解。</p><div class="row"><button id="refreshPlan">刷新计划</button><button id="prepareModel" disabled>准备分析工程</button><a id="planBundle">下载冻结分析包</a><a id="importLink" href="/material-library">返回材料库执行导入</a></div><p id="protocol" class="muted"></p><details><summary>保存来源与输出约定</summary><pre id="provenance"></pre></details></section>
<section class="card"><h2>既有材料转矩参考</h2><p class="muted">可读取已完成算例的原官方CSV，核对转矩出口与原扫描指标。不将参考曲线回填为上方校准材料的求解结果，不进行不同版本或协议的新旧比较。</p><div class="row"><label>参考算例 <select id="reference"></select></label><button id="loadReference">读取参考转矩</button><a id="rawCSV" hidden>下载原转矩CSV</a></div><p id="referenceStatus" class="muted"></p><p id="referenceError" class="error" role="alert"></p><div id="metrics" class="metrics"></div><svg id="torque" role="img" aria-label="既有算例官方转矩参考"></svg><p class="muted">显示原点，无平滑或重采样。灰色区间为指标取样窗口；只展示转矩，不输出损耗和效率。</p></section></main><script src="/static/js/calibrated_motor_analysis.js" defer></script></body></html>
