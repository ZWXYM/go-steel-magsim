<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主平台材料导出记录</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f3f6fa;color:#203047;font:15px system-ui,"Microsoft YaHei",sans-serif}header{background:#162b43;color:white;padding:22px max(20px,calc((100vw - 1160px)/2))}h1{font-size:24px;margin:0 0 12px}header a{color:#dbeafe;margin-right:18px}main{max-width:1160px;margin:22px auto;padding:0 16px}.card{background:white;border:1px solid #dce5ef;border-radius:9px;padding:20px;margin-bottom:18px}.layout{display:grid;grid-template-columns:340px 1fr;gap:16px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,input{padding:10px;border:1px solid #cbd5e1;border-radius:5px}button{background:#2466ad;color:white;cursor:pointer}button:disabled{background:#b9c7d6}.entry{display:block;width:100%;text-align:left;margin:8px 0;background:#edf3fa;color:#244668;overflow-wrap:anywhere;line-height:1.7}.entry[aria-pressed=true]{background:#2466ad;color:white}.entry small{display:block}.muted{color:#64748b;font-size:13px;line-height:1.8}.error{color:#a82c36;white-space:pre-wrap}.notice{background:#fff8e8;padding:12px;line-height:1.8}a{color:#2466ad}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto}table{border-collapse:collapse;font-size:12px;width:100%}td,th{padding:9px;text-align:left;border-bottom:1px solid #ddd;overflow-wrap:anywhere}.tablewrap{overflow:auto}.path{overflow-wrap:anywhere}@media(max-width:800px){.layout{grid-template-columns:1fr}.card{padding:15px}}
</style></head><body><header><h1>主平台材料导出记录</h1><a href="/system">系统首页</a><a href="/material-library">校准材料库</a><a href="/">主平台预测与分析</a></header><main>
<section class="card"><p>重开已有AMAT及原metadata，按材料名、文件名或模型筛选。原目录增强记录与单文件metadata分开标记；缺失、损坏或仅有元数据的记录保留显示。</p><div class="row"><button id="exportRefresh">刷新导出目录</button><label for="exportFilter">筛选</label><input id="exportFilter" type="search" placeholder="材料、文件名或模型"><a id="exportCSV" hidden>下载当前清单CSV</a></div><p id="exportStatus" class="muted" role="status"></p><p id="exportFolder" class="muted path"></p><p id="exportError" class="error" role="alert"></p><p class="notice">读取原文件和来源记录，不重新生成材料。历史增强文件沿用其目录记录；本页不将它们标为独立实测，也不自动传入校准电机分析。</p></section>
<div class="layout"><aside class="card"><h2>保存条目</h2><p id="exportFilterCount" class="muted"></p><div id="exportEntries"></div></aside><section id="exportDetail" class="card" hidden><h2 id="exportTitle"></h2><pre id="exportIdentity"></pre><p id="exportDetailError" class="error"></p><a id="exportBundle" hidden>下载材料与来源包</a><h3>原文件</h3><div class="tablewrap"><table><thead><tr><th>文件</th><th>字节</th><th>SHA256</th></tr></thead><tbody id="exportFiles"></tbody></table></div><details><summary>原始来源内容</summary><pre id="exportMetadata"></pre></details></section></div>
</main><script src="/static/js/platform_material_exports.js" defer></script></body></html>
