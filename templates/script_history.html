<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>脚本执行历史</title>
<style>body{margin:0;background:#f4f7fb;color:#1e293b;font:15px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1200px;margin:24px auto;padding:20px}section{background:white;border:1px solid #dce5ef;border-radius:10px;padding:20px;margin:18px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}button,a{color:#2364ad}button{cursor:pointer;padding:8px 14px}button:disabled{opacity:.5;cursor:default}.scroll{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#142438;color:#e2e8f0;padding:16px;max-height:450px;overflow:auto}dl{display:grid;grid-template-columns:130px 1fr;gap:8px}dd{margin:0;overflow-wrap:anywhere}p{line-height:1.8}.links a{margin-right:20px}small{color:#64748b}</style></head><body><main>
<a href="/system">系统首页</a> · <a href="/">微磁平台</a><h1>脚本执行历史</h1><p>查看当前工作目录中保存的作业状态和日志。历史状态表示当时的记录；当前进程状态未核对。此页不恢复队列、不启动或停止任务。</p>
<button id="historyRefresh">刷新历史</button><p id="historyStatus" role="status">正在读取…</p><small id="historyRoot"></small>
<section><div class="scroll"><table><thead><tr><th>作业</th><th>脚本</th><th>保存状态</th><th>排队时间</th><th>查看</th></tr></thead><tbody id="historyRows"></tbody></table></div></section>
<section id="historyDetail" hidden><h2>保存记录</h2><p id="historyDetailStatus" role="status"></p><dl id="historyFields"></dl><p class="links"><a id="historyTextLog" hidden>下载完整执行日志</a><a id="historyRawLog" hidden>下载原始stdout字节</a></p><p>下面显示保存的最后50行，完整内容可通过日志文件下载。</p><pre id="historyLog"></pre></section>
</main><script src="/static/js/script_history.js"></script></body></html>
