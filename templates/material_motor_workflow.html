<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>材料到电机进度</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#203047;font:15px system-ui,"Microsoft YaHei",sans-serif}header{background:#162b43;color:white;padding:22px}h1{font-size:23px;display:inline}header a{color:#dbeafe;margin-left:18px}main{max-width:1180px;margin:auto;padding:22px}.card{background:white;border:1px solid #dce5ef;border-radius:9px;padding:22px;margin-bottom:18px}h2{font-size:19px;margin:0 0 15px}h3{font-size:16px}.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}button,select,input{padding:10px;border:1px solid #cbd5e1;border-radius:5px}button{background:#2466ad;color:white;cursor:pointer}button:disabled{background:#94a3b8}a{color:#2466ad}.muted{color:#64748b;line-height:1.8;font-size:13px}.notice{background:#fff7df;padding:12px;border-radius:5px;line-height:1.7}.error{color:#a82c36;white-space:pre-wrap}.pill{background:#edf3fa;padding:7px 12px;border-radius:5px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e2e8f0;padding:12px;vertical-align:top}td:first-child{min-width:170px}td:last-child{min-width:200px}.stages{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.stage{padding:10px;background:#edf3fa;border-radius:5px;min-width:180px}.stage strong,.stage span{display:block}.stage span{font-size:12px;overflow-wrap:anywhere;margin-top:7px}details{margin:12px 0}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.metrics{display:flex;gap:20px;flex-wrap:wrap}.metrics strong{display:block;font-size:20px} @media(max-width:650px){main{padding:12px}h1{display:block}header a{margin-left:0;margin-right:12px}.card{padding:15px}}</style></head>
<body><header><h1>材料到电机进度</h1><a href="/system">系统首页</a><a href="/material-library">材料库</a><a href="/workbench#motor">牌号扫描</a></header>
<main><section class="card"><h2>接续已有材料与任务</h2><p class="muted">直接读取已保存的材料、副本、导入、分析和执行记录。打开对应页面继续操作，无需重新校准或预测；本页不会创建任务、派发求解或自动重试。</p><div class="row"><button id="refresh">刷新进度</button><a href="/api/workbench/material-motor/workflows/bundle">下载进度快照与汇总</a><label>筛选 <input id="search" type="search" placeholder="材料、样品或记录编号"></label><label><input id="preparedOnly" type="checkbox"> 只看已有电机副本</label></div><p id="error" class="error" role="alert"></p><p id="resource" class="notice">正在读取许可与运行模式…</p><div id="totals" class="row"></div><p id="checked" class="muted"></p></section>
<section class="card"><h2>材料与下一步</h2><div class="tablewrap"><table><thead><tr><th>材料 / 校准记录</th><th>已有进度</th><th>下一步</th></tr></thead><tbody id="materials"></tbody></table></div><p id="empty" class="muted" hidden>当前筛选没有匹配材料。</p></section>
<section class="card" id="detail" hidden><h2 id="detailTitle"></h2><p id="scope" class="muted"></p><div id="branches"></div></section>
<section class="card" id="issuesPanel" hidden><h2>需要检查的记录</h2><p class="muted">无法核验或未绑定到当前材料的记录保留可见，不作为完成结果。请保留现场并查看原记录。</p><div id="issues"></div></section>
<p class="muted">B-H校准材料当前只提供转矩分析，效率和最终优化排名禁用。许可状态只表示TCP可连接，实际导入、配置和求解仍须分别通过。原有库牌号扫描与优化流程继续在原入口使用。</p></main>
<script src="/static/js/material_motor_workflow.js" defer></script></body></html>
