<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电机官方波形对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#1e293b;font:15px system-ui,"Microsoft YaHei",sans-serif}header{padding:20px max(20px,calc((100vw - 1240px)/2));background:#162b43;color:white}header h1{display:inline;font-size:23px}header a{color:#dbeafe;margin-left:18px}main{max-width:1240px;margin:auto;padding:22px}.card{padding:21px;background:white;border:1px solid #dce5ef;border-radius:9px;margin-bottom:18px}h2{font-size:18px;margin:0 0 12px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,.button{border:0;border-radius:5px;background:#2466ad;color:white;padding:10px 16px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:wait}select{padding:9px;border:1px solid #cbd5e1;border-radius:5px;max-width:100%}.muted{color:#64748b;font-size:13px;line-height:1.7}.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.case{padding:11px;border:1px solid #dfe7ef;border-radius:5px}.case input{margin-right:9px}.case small{display:block;margin-left:25px;overflow-wrap:anywhere}.error{color:#a82c36;white-space:pre-wrap}.plots{display:grid;grid-template-columns:1fr 1fr;gap:20px}svg{display:block;width:100%;height:300px}.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}.dot{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;white-space:nowrap}td:first-child{white-space:normal;min-width:160px}a{color:#2364ad}.probe{min-height:24px;color:#475569;font-size:12px}details{margin-top:15px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:250px;overflow:auto}@media(max-width:800px){.cases,.plots{grid-template-columns:1fr}main{padding:12px}header h1{display:block;margin-bottom:10px}header a{margin-left:0;margin-right:15px}}
</style></head><body>
<header><h1>电机官方波形对比</h1><a href="/system">系统首页</a><a href="/workbench#motor">扫描与结果</a><a href="/motor-optimization">工程筛选</a></header>
<main><section class="card"><h2>选择同版本结果</h2><p class="muted">直接读取已有官方转矩与损耗 CSV。可比较同一模型版本、同一周期协议和时间网格的1至6案，原数据保持不变。缺失或失败案仍显示原因。</p><div class="row"><label>模型与周期 <select id="frame"></select></label><button id="refresh">刷新结果目录</button></div><div id="cases" class="cases">正在读取已有结果…</div><div class="row"><button id="compare" disabled>显示所选波形</button><button id="download" disabled>下载对比与原始 CSV</button><label><input type="checkbox" id="full" checked> 展示全部周期</label></div><p id="error" class="error" role="alert"></p><p id="catalogErrors" class="muted"></p></section>
<section id="result" class="card" hidden><h2>官方波形与指标</h2><p id="scope" class="muted"></p><div id="legend" class="legend"></div><div class="plots"><article><h3>转矩 / N·m</h3><svg id="torque" aria-label="官方转矩波形" role="img"></svg><div class="probe" id="torqueProbe"></div></article><article><h3>铁损 / W</h3><svg id="core_loss" aria-label="官方铁损波形" role="img"></svg><div class="probe" id="core_lossProbe"></div></article><article><h3>铜损 / W</h3><svg id="copper_loss" aria-label="官方铜损波形" role="img"></svg><div class="probe" id="copper_lossProbe"></div></article><article id="solidPanel"><h3>实心导体损耗 / W</h3><svg id="solid_loss" aria-label="官方实心导体损耗波形" role="img"></svg><div class="probe" id="solid_lossProbe"></div></article></div><p class="muted">曲线使用官方全部原始点，未平滑或插值。指向曲线查看最近采样值。阴影标示指标取样周期；铁损均值沿用原程序去除该周期首行，铜损保留全部行。效率为原工程估计口径。</p><div id="metrics" class="tablewrap"></div><details><summary>原文件、哈希及测量口径</summary><div id="sources"></div></details></section>
</main><script src="/static/js/motor_waveforms.js" defer></script></body></html>
